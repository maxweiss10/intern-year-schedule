name: Sync QGenda feed

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # every 15 min (offset from top of hour)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qgenda-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed and convert to JSON
        env:
          ICS_URL: ${{ secrets.QGENDA_ICS_URL }}
        run: python3 .github/scripts/ics_to_json.py

      - name: Commit if changed
        run: |
          git config user.name "qgenda-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add schedule-live.json
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "Update live schedule data"
            git push
          }

      - name: Keepalive (GitHub disables scheduled workflows after 60 days without a commit)
        run: |
          # Only new commits count as repository activity, so a quiet feed would
          # let this schedule lapse. If nothing has been committed in 45 days,
          # push an empty commit to reset the clock. Nothing else changes.
          idle_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit was $idle_days day(s) ago"
          [ "$idle_days" -ge 45 ] || exit 0
          git config user.name "qgenda-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: reset GitHub's 60-day scheduled-workflow timer"
          git push
